name: Build iCode installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  linux-x64:
    name: Linux x64 (.deb + .rpm + .tar.gz)
    runs-on: ubuntu-24.04
    env:
      VSCODE_QUALITY: oss
      VSCODE_ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install system build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev \
            libxkbfile-dev libnotify-bin libkrb5-dev fakeroot dpkg-dev rpm

      - name: Install npm dependencies
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            echo "Retrying npm ci ($i)..."
          done
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle iCode agent
        run: node extensions/icode-ai/script/fetch-binary.cjs --target linux-x64
        env:
          ICODE_CLI_VERSION: ${{ vars.ICODE_CLI_VERSION }}

      - name: Build iCode (min, x64)
        run: npm run gulp vscode-linux-x64-min
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .deb
        run: npm run gulp vscode-linux-x64-prepare-deb
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Build .deb
        run: npm run gulp vscode-linux-x64-build-deb
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .rpm
        run: npm run gulp vscode-linux-x64-prepare-rpm
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Build .rpm
        run: npm run gulp vscode-linux-x64-build-rpm
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Archive unpacked build
        run: tar -czf icode-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Stage artifacts
        run: |
          mkdir -p dist
          find .build/linux/deb -name '*.deb' -exec cp {} dist/ \;
          find .build/linux/rpm -name '*.rpm' -exec cp {} dist/ \;
          cp icode-linux-x64.tar.gz dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: icode-linux-x64
          path: dist/

  linux-arm64:
    name: Linux arm64 (.deb + .rpm + .tar.gz)
    runs-on: ubuntu-24.04-arm
    env:
      VSCODE_QUALITY: oss
      VSCODE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install system build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev \
            libxkbfile-dev libnotify-bin libkrb5-dev fakeroot dpkg-dev rpm

      - name: Install npm dependencies
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            echo "Retrying npm ci ($i)..."
          done
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle iCode agent
        run: node extensions/icode-ai/script/fetch-binary.cjs --target linux-arm64
        env:
          ICODE_CLI_VERSION: ${{ vars.ICODE_CLI_VERSION }}

      - name: Build iCode (min, arm64)
        run: npm run gulp vscode-linux-arm64-min
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .deb
        run: npm run gulp vscode-linux-arm64-prepare-deb
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Build .deb
        run: npm run gulp vscode-linux-arm64-build-deb
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Archive unpacked build
        run: tar -czf icode-linux-arm64.tar.gz -C .. VSCode-linux-arm64

      - name: Stage artifacts
        run: |
          mkdir -p dist
          find .build/linux/deb -name '*.deb' -exec cp {} dist/ \;
          cp icode-linux-arm64.tar.gz dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: icode-linux-arm64
          path: dist/

  darwin-arm64:
    name: macOS arm64 (.dmg)
    runs-on: macos-14
    env:
      VSCODE_QUALITY: oss
      VSCODE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            echo "Retrying npm ci ($i)..."
          done
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle iCode agent
        run: node extensions/icode-ai/script/fetch-binary.cjs --target darwin-arm64
        env:
          ICODE_CLI_VERSION: ${{ vars.ICODE_CLI_VERSION }}

      - name: Build iCode (min, arm64)
        run: npm run gulp vscode-darwin-arm64-min
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Create DMG
        run: mkdir -p out && node build/darwin/create-dmg.ts .. out

      - uses: actions/upload-artifact@v4
        with:
          name: icode-darwin-arm64
          path: out/*.dmg

  win32-x64:
    name: Windows x64 (.exe installers)
    runs-on: windows-2022
    env:
      VSCODE_QUALITY: oss
      VSCODE_ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: |
          $ErrorActionPreference = "Continue"
          for ($i = 0; $i -lt 5; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Retrying npm ci..."
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle iCode agent
        run: node extensions/icode-ai/script/fetch-binary.cjs --target win32-x64
        env:
          ICODE_CLI_VERSION: ${{ vars.ICODE_CLI_VERSION }}

      - name: Add Windows SDK signtool to PATH
        shell: powershell
        run: |
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $kitRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found under $kitRoot"
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $signtool.FullName)
          Write-Host "signtool ready: $(Split-Path $signtool.FullName)"

      - name: Build iCode (min, x64)
        run: npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: x-access-token:${{ secrets.GITHUB_TOKEN }}

      - name: Build system installer
        run: npm run gulp vscode-win32-x64-system-setup

      - name: Build user installer
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp .build/win32-x64/system-setup/*.exe dist/ 2>/dev/null || true
          cp .build/win32-x64/user-setup/*.exe dist/ 2>/dev/null || true
          cp .build/win32-x64/system-setup/*.exe dist/iCodeSetup-x64.exe 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: icode-win32-x64
          path: dist/

  release:
    name: Publish installers
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux-x64, linux-arm64, darwin-arm64, win32-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create release
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true